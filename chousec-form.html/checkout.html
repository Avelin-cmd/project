<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


    <style>
        .box{
            height: 500px;
            width: 500px;
            background-color: yellow;
            padding: 20px;
        }
        input{
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>checkout-form</h1>
    <div>
        <div class="box">
            <label for="full name">full name</label><br>
                <i class="fa-solid fa-circle-user"></i>
            <input type="text" name="name" id="name" placeholder="name" required><br>
            <label for="email">email</label><br>
            <i class="fa-solid fa-envelope"></i>
            <input type="text" name="email" id="email" placeholder="email" required><br>
            <label for="addredss">address</label><br>
            <i class="fa-solid fa-address-book"></i>
            <input type="text" name="addredss" id="addredss" placeholder="addredss" required><br>
            <label for="city">city</label><br>
            <i class="fa-solid fa-city"></i>
            <input type="text" name="city" id="city" placeholder="city" required><br>
            <label for="state">state</label><br>
            <input type="text" name="state" id="state" placeholder="state" required><br>
            <label for="zip">zip</label><br>
             <input type="text" name="zip" id="zip" placeholder="zip" required><br>
             <input type="checkbox" name="checkbox" id="checkbox" checked>
             shipping address  
        </div>
    </div>
</body>
</html>
