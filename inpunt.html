<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            height: 100px;
            width: 100px;
            background-color: darkred;
            color: lawngreen;
        }
        label{
            height: 2px;
            width: 2px;
            background-color: forestgreen;
            color: peru;
            font-size: 10px;
        }
        input{
            height: 20px;
            width: 100px;
            background-color: aquamarine;
            color: aliceblue;
        }
        .box{
            height: 100px;
            width: 100px;
            background: linear-gradient(to right, pink black);
        }
    </style>
</head>
<body>

    <div class="box">
        <form action="">
         <label for="fast-name">entar fast-name</label>
         <input type="text" name="fast-name" id="fast-name" placeholder="fast-name" required>     
         <br></br>
         <label for="last-name">last-name</label>   
         <input type="text" name="last-name" id="last-name" placeholder="last-name" required>
         <br></br>
        <label for="class">choose your class</label>
         <input type="text" name="class"id="class" placeholder="class" required>
         <br></br>
        <button type="html">html</button>
         <button type="css">css</button>
          <button type="c++">c++</button>
          <button type="javascript">javascript</button>
          <br></br>
        </form>
    </div>
</body>
</html>
